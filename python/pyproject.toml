[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "burkut"
version = "1.0.0"
authors = [
  { name="Bürküt Finans", email="destek@burkutportfoy.com" },
]
description = "Bürküt Finansal Veri API için resmi Python SDK kütüphanesi. BIST hisseleri, döviz, altın, fon ve tahvil verilerine anında erişim."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
]
keywords = ["burkut", "bist", "borsa", "finans", "hisse", "doviz", "altin", "tefas", "viop", "api"]

[project.urls]
"Homepage" = "https://burkutportfoy.com/developers"
"Documentation" = "https://burkutportfoy.com/developer"
"Repository" = "https://github.com/sametakan29/burkut-sdks"
"Bug Tracker" = "https://github.com/sametakan29/burkut-sdks/issues"
